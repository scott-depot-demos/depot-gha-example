<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vinyl Collection Manager</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎵 Vinyl Collection Manager</h1>
            <p class="subtitle">Manage your record collection</p>
        </header>

        <div class="actions-bar">
            <button class="btn btn-primary" id="add-record-btn">+ Add Record</button>
            <div class="collection-stats">
                <span id="record-count">0</span> records in collection
            </div>
        </div>

        <div class="records-grid" id="records-grid">
            <!-- Records will be dynamically inserted here -->
        </div>

        <div class="empty-state" id="empty-state" style="display: none;">
            <div class="empty-icon">💿</div>
            <h2>No records yet</h2>
            <p>Start building your collection by adding your first record!</p>
            <button class="btn btn-primary" onclick="document.getElementById('add-record-btn').click()">
                Add Your First Record
            </button>
        </div>
    </div>

    <!-- Add/Edit Record Modal -->
    <div class="modal" id="record-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">Add Record</h2>
                <button class="modal-close" id="modal-close">&times;</button>
            </div>
            <form id="record-form">
                <input type="hidden" id="record-id">
                
                <div class="form-group">
                    <label for="artist">Artist *</label>
                    <input type="text" id="artist" required placeholder="e.g., Pink Floyd">
                </div>
                
                <div class="form-group">
                    <label for="album">Album *</label>
                    <input type="text" id="album" required placeholder="e.g., The Dark Side of the Moon">
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="year">Year</label>
                        <input type="number" id="year" min="1900" max="2099" placeholder="1973">
                    </div>
                    
                    <div class="form-group">
                        <label for="genre">Genre</label>
                        <input type="text" id="genre" placeholder="e.g., Progressive Rock">
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="condition">Condition</label>
                    <select id="condition">
                        <option value="Mint">Mint</option>
                        <option value="Excellent">Excellent</option>
                        <option value="Very Good">Very Good</option>
                        <option value="Good">Good</option>
                        <option value="Fair">Fair</option>
                        <option value="Poor">Poor</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="notes">Notes</label>
                    <textarea id="notes" rows="3" placeholder="Any additional notes about this record..."></textarea>
                </div>
                
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" id="cancel-btn">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Record</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div class="modal" id="delete-modal">
        <div class="modal-content modal-small">
            <div class="modal-header">
                <h2>Delete Record</h2>
                <button class="modal-close" id="delete-modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <p>Are you sure you want to delete this record?</p>
                <p class="delete-record-info" id="delete-record-info"></p>
            </div>
            <div class="form-actions">
                <button type="button" class="btn btn-secondary" id="delete-cancel-btn">Cancel</button>
                <button type="button" class="btn btn-danger" id="delete-confirm-btn">Delete</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
