name: Docker Build with Depot

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  # Docker Hub registry
  REGISTRY: docker.io

jobs:
  build-with-depot:
    name: Build with Depot (Fast ⚡)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute lowercase image name
        id: image
        shell: bash
        run: |
          # Docker image names must be lowercase.
          # For Docker Hub, we push to DOCKER_USERNAME/<repo>.
          repo="${GITHUB_REPOSITORY#*/}"
          echo "repo=${repo,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Depot
        uses: depot/setup-action@v1

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/${{ steps.image.outputs.repo }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Depot build (PR - no push, no cache)
        if: ${{ github.event_name == 'pull_request' }}
        uses: depot/build-push-action@v1
        with:
          project: ${{ secrets.DEPOT_PROJECT_ID }}
          token: ${{ secrets.DEPOT_PROJECT_TOKEN }}
          context: .
          # PR builds: don't push and don't use GHA cache (it can fail on the remote builder).
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Depot build & push (push/workflow_dispatch)
        if: ${{ github.event_name != 'pull_request' }}
        uses: depot/build-push-action@v1
        with:
          project: ${{ secrets.DEPOT_PROJECT_ID }}
          token: ${{ secrets.DEPOT_PROJECT_TOKEN }}
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Push builds: use a registry-backed cache in Docker Hub instead of GHA cache.
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/${{ steps.image.outputs.repo }}:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/${{ steps.image.outputs.repo }}:buildcache,mode=max

  build-standard:
    name: Build Standard (Comparison)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute lowercase image name
        id: image
        shell: bash
        run: |
          # Docker image names must be lowercase.
          # For Docker Hub, we push to DOCKER_USERNAME/<repo>.
          repo="${GITHUB_REPOSITORY#*/}"
          echo "repo=${repo,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/${{ steps.image.outputs.repo }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build and push (standard)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false  # Don't push standard builds to save space
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  compare-results:
    name: Compare Build Times
    runs-on: ubuntu-latest
    needs: [build-with-depot, build-standard]
    if: always()
    
    steps:
      - name: Display comparison
        run: |
          echo "## Build Time Comparison" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Method | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Depot | ${{ needs.build-with-depot.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Standard | ${{ needs.build-standard.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check the workflow logs to see detailed timing information." >> $GITHUB_STEP_SUMMARY
